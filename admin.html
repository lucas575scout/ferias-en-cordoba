<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel SuperAdmin | Ferias en Córdoba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { green: '#2E7D32', lightgreen: '#E8F5E9', dark: '#1B5E20' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <i class="fa-solid fa-user-shield text-brand-green text-2xl"></i>
        <span class="font-bold text-xl text-brand-dark">SuperAdmin General</span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-brand-green border border-brand-green px-3 py-1.5 rounded-full hover:bg-brand-green hover:text-white transition">Volver al Sitio</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <!-- VINCULAR FERIANTE A FERIA -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-link text-brand-green"></i> Asignar Feriante a una Feria
      </h2>

      <form id="form-vincular-feriante" class="space-y-4" onsubmit="vincularFerianteAFeria(event)">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Feriante</label>
            <select id="select-feriante" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
              <option value="">Cargando feriantes...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Feria</label>
            <select id="select-feria" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
              <option value="">Cargando ferias...</option>
            </select>
          </div>
        </div>
        <button type="submit" class="bg-brand-green text-white font-bold px-5 py-2.5 rounded-lg text-sm hover:bg-brand-dark transition">
          Guardar Vinculación
        </button>
      </form>
    </div>

    <!-- VINCULAR PRODUCTO A FERIANTE -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-boxes-packing text-brand-green"></i> Asignar Producto a un Feriante
      </h2>

      <form id="form-vincular-producto" class="space-y-4" onsubmit="vincularProductoAFeriante(event)">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Producto</label>
            <select id="select-producto" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
              <option value="">Cargando productos...</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Feriante / Marca</label>
            <select id="select-feriante-prod" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
              <option value="">Cargando feriantes...</option>
            </select>
          </div>
        </div>
        <button type="submit" class="bg-brand-green text-white font-bold px-5 py-2.5 rounded-lg text-sm hover:bg-brand-dark transition">
          Asignar Producto
        </button>
      </form>
    </div>

    <!-- COORDENADAS DE MAPA PARA FERIAS -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-location-dot text-brand-green"></i> Ajustar Ubicación de Feria (Latitud / Longitud)
      </h2>

      <form id="form-coordenadas" class="space-y-4" onsubmit="guardarCoordenadas(event)">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Feria</label>
          <select id="select-feria-coord" required class="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
            <option value="">Cargando ferias...</option>
          </select>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Latitud</label>
            <input type="text" id="feria-lat" required placeholder="-31.4135" class="w-full p-2.5 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Longitud</label>
            <input type="text" id="feria-lng" required placeholder="-64.1810" class="w-full p-2.5 border rounded-lg text-sm">
          </div>
        </div>
        <button type="submit" class="bg-brand-green text-white font-bold px-5 py-2.5 rounded-lg text-sm hover:bg-brand-dark transition">
          Actualizar Coordenadas
        </button>
      </form>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://mtnvffcgbydtavfihxqt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10bnZmZmNnYnlkdGF2ZmloeHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzQwMjEsImV4cCI6MjEwNDE1MDAyMX0.2A-x9_Dm_m5CUZxjMuAdvQrA1cWdFLPQAjBvWwxc9NY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Cargar listas desplegables al iniciar
    document.addEventListener('DOMContentLoaded', () => {
      cargarFerias();
      cargarFeriantes();
      cargarProductos();
    });

    async function cargarFerias() {
      const { data } = await _supabase.from('ferias').select('id, nombre');
      const selects = [document.getElementById('select-feria'), document.getElementById('select-feria-coord')];
      
      selects.forEach(select => {
        if (!select) return;
        select.innerHTML = '<option value="">Seleccione una feria...</option>';
        if (data) {
          data.forEach(f => {
            select.innerHTML += `<option value="${f.id}">${f.nombre}</option>`;
          });
        }
      });
    }

    async function cargarFeriantes() {
      const { data } = await _supabase.from('feriantes').select('id, nombre');
      const selects = [document.getElementById('select-feriante'), document.getElementById('select-feriante-prod')];
      
      selects.forEach(select => {
        if (!select) return;
        select.innerHTML = '<option value="">Seleccione un feriante...</option>';
        if (data) {
          data.forEach(f => {
            select.innerHTML += `<option value="${f.id}">${f.nombre}</option>`;
          });
        }
      });
    }

    async function cargarProductos() {
      const { data } = await _supabase.from('productos').select('id, nombre');
      const select = document.getElementById('select-producto');
      if (!select) return;

      select.innerHTML = '<option value="">Seleccione un producto...</option>';
      if (data) {
        data.forEach(p => {
          select.innerHTML += `<option value="${p.id}">${p.nombre}</option>`;
        });
      }
    }

    async function vincularFerianteAFeria(e) {
      e.preventDefault();
      const feriante_id = document.getElementById('select-feriante').value;
      const feria_id = document.getElementById('select-feria').value;

      const { error } = await _supabase.from('feriantes_ferias').insert([{ feriante_id, feria_id }]);
      if (!error) alert('¡Feriante asignado a la feria!');
      else alert('Error: ' + error.message);
    }

    async function vincularProductoAFeriante(e) {
      e.preventDefault();
      const producto_id = document.getElementById('select-producto').value;
      const feriante_id = document.getElementById('select-feriante-prod').value;

      const { error } = await _supabase.from('productos').update({ feriante_id }).eq('id', producto_id);
      if (!error) alert('¡Producto asignado al feriante!');
      else alert('Error: ' + error.message);
    }

    async function guardarCoordenadas(e) {
      e.preventDefault();
      const feria_id = document.getElementById('select-feria-coord').value;
      const lat = parseFloat(document.getElementById('feria-lat').value);
      const lng = parseFloat(document.getElementById('feria-lng').value);

      const { error } = await _supabase.from('ferias').update({ lat, lng }).eq('id', feria_id);
      if (!error) alert('¡Ubicación de la feria actualizada!');
      else alert('Error: ' + error.message);
    }
  </script>
</body>
</html>
