<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Feria | Ferias en Córdoba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { green: '#2E7D32', lightgreen: '#E8F5E9', dark: '#1B5E20' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <i class="fa-solid fa-store text-brand-green text-2xl"></i>
        <span class="font-bold text-xl text-brand-dark">Panel de Feria</span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-brand-green border border-brand-green px-3 py-1.5 rounded-full hover:bg-brand-green hover:text-white transition">Volver al Sitio</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <!-- PERFIL Y CONFIGURACIÓN DE LA FERIA -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-6">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-sliders text-brand-green"></i> Configuración de la Feria
      </h2>

      <form id="form-perfil-feria" class="space-y-5" onsubmit="guardarPerfilFeria(event)">
        
        <!-- Nombre y Dirección -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre de la Feria</label>
            <input type="text" id="feria-nombre" required class="w-full p-2.5 border rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Dirección / Ubicación</label>
            <input type="text" id="feria-direccion" required class="w-full p-2.5 border rounded-lg text-sm" placeholder="Ej: Plaza Alberdi">
          </div>
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción de la Feria</label>
          <textarea id="feria-descripcion" rows="3" class="w-full p-2.5 border rounded-lg text-sm" placeholder="Horarios, días de funcionamiento, propuesta de la feria..."></textarea>
        </div>

        <!-- Contacto y Redes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp de Contacto</label>
            <input type="text" id="feria-whatsapp" class="w-full p-2.5 border rounded-lg text-sm" placeholder="3511234567">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Instagram (@usuario)</label>
            <input type="text" id="feria-instagram" class="w-full p-2.5 border rounded-lg text-sm" placeholder="feria_ejemplo">
          </div>
        </div>

        <!-- Imagen de Portada / Header -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Foto de Portada / Header</label>
          <input type="file" id="feria-portada" accept="image/*" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
        </div>

        <!-- MODO LLUVIA (SWITCH) -->
        <div class="flex items-center justify-between p-4 bg-blue-50 rounded-xl border border-blue-100">
          <div>
            <span class="font-bold text-sm text-blue-900 block">🌧️ Modo Lluvia (Mal Tiempo)</span>
            <span class="text-xs text-blue-700">Activalo si la feria se traslada o se suspende por mal clima.</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="feria-modo-lluvia" class="sr-only peer">
            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
          </label>
        </div>

        <!-- RUBROS Y SKILLS PRESENTES EN LA FERIA -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-2">Rubros / Categorías disponibles en el predio:</label>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm">
            <label class="flex items-center gap-2 border p-2 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="checkbox" name="skills" value="alimentacion" class="rounded text-brand-green"> 🟡 Alimentación
            </label>
            <label class="flex items-center gap-2 border p-2 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="checkbox" name="skills" value="textil" class="rounded text-brand-green"> 🔵 Textil / Moda
            </label>
            <label class="flex items-center gap-2 border p-2 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="checkbox" name="skills" value="artesanias" class="rounded text-brand-green"> 🔴 Artesanías
            </label>
            <label class="flex items-center gap-2 border p-2 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="checkbox" name="skills" value="impacto" class="rounded text-brand-green"> 🟢 Impacto / Ecología
            </label>
            <label class="flex items-center gap-2 border p-2 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="checkbox" name="skills" value="servicios" class="rounded text-brand-green"> ⚪ Servicios / Otros
            </label>
          </div>
        </div>

        <button type="submit" class="w-full bg-brand-green text-white font-bold py-2.5 rounded-lg text-sm hover:bg-brand-dark transition">
          Guardar Ajustes de la Feria
        </button>
      </form>
    </div>

    <!-- PUBLICAR EVENTO / NOVEDAD -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-4">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-bullhorn text-brand-green"></i> Publicar Novedad o Flyer
      </h2>
      <form id="form-evento" class="space-y-4" onsubmit="publicarEvento(event)">
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Título de la Novedad / Evento</label>
          <input type="text" id="evento-titulo" required class="w-full p-2.5 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Flyer Promocional</label>
          <input type="file" id="evento-flyer" accept="image/*" required class="w-full p-2 border rounded-lg text-sm bg-gray-50">
        </div>
        <button type="submit" class="bg-brand-green text-white font-bold px-4 py-2 rounded-lg text-sm hover:bg-brand-dark transition">
          Publicar Novedad
        </button>
      </form>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://mtnvffcgbydtavfihxqt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10bnZmZmNnYnlkdGF2ZmloeHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzQwMjEsImV4cCI6MjEwNDE1MDAyMX0.2A-x9_Dm_m5CUZxjMuAdvQrA1cWdFLPQAjBvWwxc9NY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // FUNCIÓN PARA SUBIR FOTO
    async function subirImagen(inputElement, bucketName) {
      const file = inputElement.files[0];
      if (!file) return null;

      const filename = `${Date.now()}_${Math.random().toString(36).substring(2,7)}.${file.name.split('.').pop()}`;
      const { data, error } = await _supabase.storage.from(bucketName).upload(filename, file);

      if (error) {
        alert('Error al subir imagen: ' + error.message);
        return null;
      }
      return _supabase.storage.from(bucketName).getPublicUrl(filename).data.publicUrl;
    }

    // GUARDAR O ACTUALIZAR PERFIL DE FERIA
    async function guardarPerfilFeria(e) {
      e.preventDefault();

      const nombre = document.getElementById('feria-nombre').value;
      const direccion = document.getElementById('feria-direccion').value;
      const descripcion = document.getElementById('feria-descripcion').value;
      const whatsapp = document.getElementById('feria-whatsapp').value;
      const instagram = document.getElementById('feria-instagram').value;
      const modoLluvia = document.getElementById('feria-modo-lluvia').checked;

      // Obtener skills seleccionados
      const checkboxes = document.querySelectorAll('input[name="skills"]:checked');
      const skills = Array.from(checkboxes).map(cb => cb.value);

      // Subir portada si seleccionó archivo
      const portadaUrl = await subirImagen(document.getElementById('feria-portada'), 'logos-ferias');

      const datosFeria = {
        nombre,
        direccion,
        descripcion,
        whatsapp,
        instagram,
        modo_lluvia: modoLluvia,
        skills
      };

      if (portadaUrl) datosFeria.portada_url = portadaUrl;

      const { error } = await _supabase.from('ferias').insert([datosFeria]);

      if (!error) {
        alert('¡Configuración de la feria guardada con éxito!');
      } else {
        alert('Error al guardar datos: ' + error.message);
      }
    }

    // PUBLICAR FLYER / EVENTO
    async function publicarEvento(e) {
      e.preventDefault();
      const titulo = document.getElementById('evento-titulo').value;
      const flyerUrl = await subirImagen(document.getElementById('evento-flyer'), 'flyers-eventos');

      if (flyerUrl) {
        const { error } = await _supabase.from('eventos').insert([{ titulo, imagen_url: flyerUrl }]);
        if (!error) {
          alert('¡Novedad publicada!');
          e.target.reset();
        }
      }
    }
  </script>
</body>
</html>
