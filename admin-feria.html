<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador de Feria - EcoFerias Córdoba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800">
    <header class="bg-emerald-800 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-lg">Panel de Gestión de Feria</h1>
        <button onclick="cerrarSesion()" class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded text-xs font-semibold">Cerrar Sesión</button>
    </header>

    <main class="max-w-4xl mx-auto p-6 space-y-6">
        <div class="bg-white p-6 rounded-xl shadow space-y-4">
            <h2 class="text-xl font-bold text-emerald-900 border-b pb-2">Estado y Alertas de Clima</h2>
            <div class="flex items-center justify-between">
                <div>
                    <h3 class="font-bold text-sm">Modo Lluvia / Suspensión</h3>
                    <p class="text-xs text-slate-500">Activalo para avisar a los visitantes que la feria presencial se suspende.</p>
                </div>
                <input type="checkbox" id="check-modo-lluvia" class="w-6 h-6 text-emerald-600 rounded">
            </div>
        </div>

        <div class="bg-white p-6 rounded-xl shadow space-y-4">
            <h2 class="text-xl font-bold text-emerald-900 border-b pb-2">Publicar Novedad o Evento</h2>
            <form id="form-publicacion" class="space-y-3">
                <input type="text" id="pub-titulo" placeholder="Título de la publicación (ej: Taller de Huerta)" required class="w-full p-2 border rounded text-sm">
                <textarea id="pub-desc" placeholder="Descripción breve..." class="w-full p-2 border rounded text-sm"></textarea>
                <input type="date" id="pub-fecha" required class="p-2 border rounded text-sm">
                <button type="submit" class="bg-emerald-600 text-white font-bold px-4 py-2 rounded text-sm hover:bg-emerald-700">Publicar en Carrusel</button>
            </form>
        </div>
    </main>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
