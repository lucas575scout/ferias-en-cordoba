<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Paneles - EcoFerias Córdoba</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full">
        <div class="text-center mb-6">
            <span class="text-4xl">🌿</span>
            <h2 class="text-2xl font-bold text-slate-800 mt-2">EcoFerias Córdoba</h2>
            <p class="text-sm text-slate-500">Ingresá a tu panel de administración</p>
        </div>

        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" id="email-input" required placeholder="tuemail@ejemplo.com" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Contraseña</label>
                <input type="password" id="password-input" required placeholder="••••••••" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none text-sm">
            </div>

            <div id="error-msg" class="hidden p-3 bg-red-100 text-red-700 text-xs rounded-lg font-medium"></div>

            <button type="submit" id="btn-submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-lg transition text-sm">
                Iniciar Sesión
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-xs text-emerald-600 hover:underline">← Volver al sitio público</a>
        </div>
    </div>

    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
