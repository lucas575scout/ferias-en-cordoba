<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Ferias en Córdoba</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { green: '#2E7D32', dark: '#1B5E20' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-2xl shadow-md w-full max-w-md border border-gray-200">
    <div class="text-center mb-6">
      <a href="index.html" class="inline-flex items-center gap-2 text-brand-dark font-bold text-2xl mb-2">
        <i class="fa-solid fa-store text-brand-green"></i> Ferias en Córdoba
      </a>
      <h1 class="text-xl font-bold text-gray-800">Acceso a Gestión</h1>
      <p class="text-xs text-gray-500 mt-1">Ingresá con tu cuenta de Feria o Feriante</p>
    </div>

    <!-- Muestra de errores -->
    <div id="error-msg" class="hidden bg-red-100 border border-red-400 text-red-700 text-xs p-3 rounded-lg mb-4 text-center"></div>

    <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="tu@email.com" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-brand-green outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 border rounded-lg text-sm focus:ring-2 focus:ring-brand-green outline-none">
      </div>

      <button type="submit" id="btn-submit" class="w-full bg-brand-green hover:bg-brand-dark text-white font-bold py-3 rounded-lg shadow transition text-sm">
        Iniciar Sesión
      </button>
    </form>

    <div class="mt-6 text-center border-t pt-4">
      <a href="index.html" class="text-xs text-gray-500 hover:text-brand-green">← Volver al mapa principal</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
