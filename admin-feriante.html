<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Feriante | Ferias en Córdoba</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { green: '#2E7D32', lightgreen: '#E8F5E9', dark: '#1B5E20' } }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-100 text-gray-800 flex flex-col min-h-screen">

  <header class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-2">
        <i class="fa-solid fa-store text-brand-green text-2xl"></i>
        <span class="font-bold text-xl text-brand-dark">Panel de Feriante</span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-brand-green border border-brand-green px-3 py-1.5 rounded-full hover:bg-brand-green hover:text-white transition">Volver al Sitio</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8 flex-grow w-full space-y-8">

    <!-- PERFIL Y CONFIGURACIÓN DEL FERIANTE -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-6">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-user-pen text-brand-green"></i> Perfil del Emprendimiento
      </h2>

      <form id="form-perfil-feriante" class="space-y-5" onsubmit="guardarPerfilFeriante(event)">
        
        <!-- Nombre Comercial -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Feriante / Emprendimiento</label>
          <input type="text" id="feriante-nombre" required class="w-full p-2.5 border rounded-lg text-sm">
        </div>

        <!-- Descripción -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Descripción de la propuesta</label>
          <textarea id="feriante-descripcion" rows="3" class="w-full p-2.5 border rounded-lg text-sm" placeholder="Contá qué hacés, cómo elaborás tus productos y tu historia..."></textarea>
        </div>

        <!-- Contacto y Redes -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp de Pedidos</label>
            <input type="text" id="feriante-whatsapp" class="w-full p-2.5 border rounded-lg text-sm" placeholder="3511234567">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Instagram (@usuario)</label>
            <input type="text" id="feriante-instagram" class="w-full p-2.5 border rounded-lg text-sm" placeholder="mi_emprendimiento">
          </div>
        </div>

        <!-- SELECCIÓN DE CATEGORÍA PRINCIPAL -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-2">Categoría / Rubro Principal:</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm">
            <label class="flex items-center gap-2 border p-2.5 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="categoria" value="alimentacion" class="text-yellow-500" required>
              <span class="w-3 h-3 rounded-full bg-yellow-400 inline-block"></span> 🟡 Alimentación
            </label>
            <label class="flex items-center gap-2 border p-2.5 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="categoria" value="textil" class="text-blue-500">
              <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 🔵 Textil y Moda
            </label>
            <label class="flex items-center gap-2 border p-2.5 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="categoria" value="artesanias" class="text-red-700">
              <span class="w-3 h-3 rounded-full bg-red-800 inline-block"></span> 🔴 Artesanías
            </label>
            <label class="flex items-center gap-2 border p-2.5 rounded-lg cursor-pointer hover:bg-gray-50">
              <input type="radio" name="categoria" value="impacto" class="text-green-600">
              <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span> 🟢 Impacto / Natura
            </label>
            <label class="flex items-center gap-2 border p-2.5 rounded-lg cursor-pointer hover:bg-gray-50 col-span-1 sm:col-span-2">
              <input type="radio" name="categoria" value="servicios" class="text-gray-400">
              <span class="w-3 h-3 rounded-full bg-white border border-gray-400 inline-block"></span> ⚪ Servicios / Accesorios / Otros
            </label>
          </div>
        </div>

        <!-- MENÚ DESPLEGABLE DE SKILLS / INSIGNIAS -->
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Seleccionar Habilidades / Insignias:</label>
          <select id="select-skills" class="w-full p-2.5 border rounded-lg text-sm bg-white" onchange="agregarSkill(this.value)">
            <option value="">-- Cargar insignias desde la base de datos... --</option>
          </select>
          <div id="skills-seleccionadas" class="flex flex-wrap gap-2 mt-3"></div>
        </div>

        <!-- IMÁGENES -->
        <div class="space-y-3">
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Logo del Emprendimiento</label>
            <input type="file" id="feriante-logo" accept="image/*" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Foto de Perfil del Emprendendedor</label>
            <input type="file" id="feriante-perfil" accept="image/*" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-600 mb-1">Imagen de Portada / Header</label>
            <input type="file" id="feriante-portada" accept="image/*" class="w-full p-2 border rounded-lg text-sm bg-gray-50">
          </div>
        </div>

        <!-- MODO ACTIVO -->
        <div class="flex items-center justify-between p-4 bg-emerald-50 rounded-xl border border-emerald-100">
          <div>
            <span class="font-bold text-sm text-emerald-900 block">🟢 Venta Online / Catálogo Activo</span>
            <span class="text-xs text-emerald-700">Activalo para recibir pedidos por WhatsApp.</span>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="feriante-activo" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-emerald-600"></div>
          </label>
        </div>

        <button type="submit" class="w-full bg-brand-green text-white font-bold py-2.5 rounded-lg text-sm hover:bg-brand-dark transition">
          Actualizar Mi Perfil
        </button>
      </form>
    </div>

    <!-- CARGAR Y GESTIONAR PRODUCTOS AL CATÁLOGO -->
    <div class="bg-white p-6 rounded-2xl border shadow-sm space-y-6">
      <h2 class="font-bold text-lg text-brand-dark flex items-center gap-2">
        <i class="fa-solid fa-box text-brand-green"></i> Gestión de Productos y Precios
      </h2>

      <!-- Formulario Agregar -->
      <form id="form-producto-feriante" class="space-y-4 bg-gray-50 p-4 rounded-xl border" onsubmit="guardarProductoPropio(event)">
        <h3 class="font-bold text-sm text-gray-700">Agregar Nuevo Producto</h3>
        
        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nombre del Producto</label>
          <input type="text" id="prod-nombre" required class="w-full p-2.5 border rounded-lg text-sm bg-white" placeholder="Ej: Mermelada artesanal de higo">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Precio ($)</label>
          <input type="number" id="prod-precio" step="0.01" min="0" class="w-full p-2.5 border rounded-lg text-sm bg-white" placeholder="Ej: 2500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Foto del Producto</label>
          <input type="file" id="prod-foto" accept="image/*" required class="w-full p-2 border rounded-lg text-sm bg-white">
        </div>

        <button type="submit" class="bg-brand-green text-white font-bold px-4 py-2 rounded-lg text-sm hover:bg-brand-dark transition shadow">
          Guardar Producto
        </button>
      </form>

      <!-- Lista de Productos Cargados con opción de eliminar -->
      <div class="space-y-3">
        <h3 class="font-bold text-sm text-gray-700">Productos en tu Catálogo</h3>
        <div id="lista-productos-panel" class="space-y-2 max-h-72 overflow-y-auto pr-1">
          <p class="text-xs text-gray-400 italic">Cargando tus productos...</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    const SUPABASE_URL = 'https://mtnvffcgbydtavfihxqt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10bnZmZmNnYnlkdGF2ZmloeHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NzQwMjEsImV4cCI6MjEwNDE1MDAyMX0.2A-x9_Dm_m5CUZxjMuAdvQrA1cWdFLPQAjBvWwxc9NY';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let ferianteActual = null;
    let skillsElegidas = [];

    document.addEventListener('DOMContentLoaded', async () => {
      await cargarOpcionesSkills();
      await inicializarPanel();
    });

    async function cargarOpcionesSkills() {
      const { data: lista } = await _supabase.from('habilidades').select('*').order('nombre', { ascending: true });
      const select = document.getElementById('select-skills');
      if (lista && select) {
        select.innerHTML = '<option value="">-- Selecciona una habilidad --</option>';
        lista.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.nombre;
          opt.textContent = item.nombre;
          select.appendChild(opt);
        });
      }
    }

    async function inicializarPanel() {
      const { data: { user } } = await _supabase.auth.getUser();
      if (user) {
        const { data: feriante } = await _supabase.from('feriantes').select('*').eq('user_id', user.id).single();
        if (feriante) {
          ferianteActual = feriante;
          cargarDatosEnFormulario(feriante);
          await cargarProductosPanel();
        } else {
          document.getElementById('lista-productos-panel').innerHTML = '<p class="text-xs text-gray-400 italic">Guardá tu perfil primero para ver tus productos.</p>';
        }
      } else {
        document.getElementById('lista-productos-panel').innerHTML = '<p class="text-xs text-gray-400 italic">Iniciá sesión para gestionar tus productos.</p>';
      }
    }

    function cargarDatosEnFormulario(f) {
      document.getElementById('feriante-nombre').value = f.nombre_emprendimiento || f.nombre || '';
      document.getElementById('feriante-descripcion').value = f.descripcion || '';
      document.getElementById('feriante-whatsapp').value = f.whatsapp || '';
      document.getElementById('feriante-instagram').value = f.instagram || '';
      if (f.activo !== undefined) document.getElementById('feriante-activo').checked = f.activo;

      if (f.categoria) {
        const rad = document.querySelector(`input[name="categoria"][value="${f.categoria}"]`);
        if (rad) rad.checked = true;
      }

      let skillsArray = f.skills || [];
      if (typeof skillsArray === 'string') {
        try { skillsArray = JSON.parse(skillsArray); } catch (e) { skillsArray = skillsArray.split(',').map(s => s.trim()); }
      }
      skillsElegidas = Array.isArray(skillsArray) ? skillsArray : [];
      renderizarEtiquetas();
    }

    function agregarSkill(nombre) {
      if (!nombre || skillsElegidas.includes(nombre)) return;
      skillsElegidas.push(nombre);
      renderizarEtiquetas();
      document.getElementById('select-skills').value = '';
    }

    function quitarSkill(nombre) {
      skillsElegidas = skillsElegidas.filter(s => s !== nombre);
      renderizarEtiquetas();
    }

    function renderizarEtiquetas() {
      const cont = document.getElementById('skills-seleccionadas');
      if (!cont) return;
      cont.innerHTML = skillsElegidas.map(s => `
        <span class="inline-flex items-center gap-1.5 bg-green-100 text-green-800 text-xs font-semibold px-3 py-1 rounded-full border border-green-200">
          <i class="fa-solid fa-award text-green-600"></i>
          ${s}
          <button type="button" onclick="quitarSkill('${s}')" class="text-green-600 hover:text-red-600 font-bold ml-1 text-sm">&times;</button>
        </span>
      `).join('');
    }

    async function subirImagen(inputElement, bucketName) {
      const file = inputElement.files[0];
      if (!file) return null;

      const filename = `${Date.now()}_${Math.random().toString(36).substring(2,7)}.${file.name.split('.').pop()}`;
      const { data, error } = await _supabase.storage.from(bucketName).upload(filename, file);

      if (error) {
        alert('Error al subir imagen: ' + error.message);
        return null;
      }
      return _supabase.storage.from(bucketName).getPublicUrl(filename).data.publicUrl;
    }

    async function guardarPerfilFeriante(e) {
      e.preventDefault();

      const { data: { user } } = await _supabase.auth.getUser();
      const nombre = document.getElementById('feriante-nombre').value;
      const descripcion = document.getElementById('feriante-descripcion').value;
      const whatsapp = document.getElementById('feriante-whatsapp').value;
      const instagram = document.getElementById('feriante-instagram').value;
      const activo = document.getElementById('feriante-activo').checked;

      const categoriaInput = document.querySelector('input[name="categoria"]:checked');
      const categoria = categoriaInput ? categoriaInput.value : 'servicios';

      const logoUrl = await subirImagen(document.getElementById('feriante-logo'), 'logos-feriantes');
      const perfilUrl = await subirImagen(document.getElementById('feriante-perfil'), 'logos-feriantes');
      const portadaUrl = await subirImagen(document.getElementById('feriante-portada'), 'logos-feriantes');

      const datosFeriante = {
        nombre_emprendimiento: nombre,
        descripcion,
        whatsapp,
        instagram,
        categoria,
        activo,
        skills: skillsElegidas,
        user_id: user ? user.id : null
      };

      if (logoUrl) datosFeriante.logo_url = logoUrl;
      if (perfilUrl) datosFeriante.perfil_url = perfilUrl;
      if (portadaUrl) datosFeriante.portada_url = portadaUrl;

      let result;
      if (ferianteActual) {
        result = await _supabase.from('feriantes').update(datosFeriante).eq('id', ferianteActual.id);
      } else {
        result = await _supabase.from('feriantes').insert([datosFeriante]).select().single();
        if (result.data) ferianteActual = result.data;
      }

      if (!result.error) {
        alert('¡Perfil actualizado correctamente!');
      } else {
        alert('Error al guardar el perfil: ' + result.error.message);
      }
    }

    async function cargarProductosPanel() {
      if (!ferianteActual) return;
      const container = document.getElementById('lista-productos-panel');
      container.innerHTML = '<p class="text-xs text-gray-400 italic">Cargando productos...</p>';

      let { data: prods, error } = await _supabase
        .from('productos')
        .select('*')
        .eq('feriante_id', ferianteActual.id);

      if (error || !prods || prods.length === 0) {
        const fallback = await _supabase.from('productos_feriante').select('*').eq('feriante_id', ferianteActual.id);
        prods = fallback.data || [];
      }

      if (prods.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400 italic">No tenés productos cargados todavía.</p>';
        return;
      }

      container.innerHTML = '';
      prods.forEach(p => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between p-3 border rounded-xl bg-white shadow-sm gap-3';
        div.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            <img src="${p.imagen_url || 'https://via.placeholder.com/60'}" class="w-12 h-12 rounded-lg object-cover border flex-shrink-0">
            <div class="min-w-0">
              <h4 class="font-bold text-sm text-gray-800 truncate">${p.nombre}</h4>
              <p class="text-xs font-semibold text-brand-dark">${p.precio ? '$' + p.precio : 'Sin precio cargado'}</p>
            </div>
          </div>
          <button type="button" onclick="eliminarProducto('${p.id}')" class="text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 p-2 rounded-lg transition" title="Eliminar producto">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        `;
        container.appendChild(div);
      });
    }

    async function guardarProductoPropio(e) {
      e.preventDefault();

      if (!ferianteActual) {
        alert('Debes guardar primero tu perfil para vincular los productos.');
        return;
      }

      const nombre = document.getElementById('prod-nombre').value;
      const precio = document.getElementById('prod-precio').value;
      const fotoUrl = await subirImagen(document.getElementById('prod-foto'), 'productos');

      if (fotoUrl) {
        // Asignamos el valor de CO2 ahorrado unitario según la categoría del feriante
        let co2Unitario = 1.0; 
        const cat = (ferianteActual.categoria || '').toLowerCase();
        if (cat.includes('aliment')) co2Unitario = 0.8;
        else if (cat.includes('textil')) co2Unitario = 1.5;
        else if (cat.includes('artesan')) co2Unitario = 1.2;
        else if (cat.includes('impacto')) co2Unitario = 0.9;

        const datosProd = { 
          nombre: nombre, 
          precio: precio ? parseFloat(precio) : null,
          imagen_url: fotoUrl, 
          feriante_id: ferianteActual.id,
          categoria: ferianteActual.categoria || 'general',
          co2_ahorrado_unitario: co2Unitario 
        };

        let { error } = await _supabase.from('productos').insert([datosProd]);
        
        if (error) {
          error = (await _supabase.from('productos_feriante').insert([datosProd])).error;
        }

        if (!error) {
          alert('¡Producto agregado al catálogo y huella actualizada exitosamente!');
          document.getElementById('form-producto-feriante').reset();
          await cargarProductosPanel();
        } else {
          alert('Error al guardar el producto: ' + error.message);
        }
      }
    }

    async function eliminarProducto(prodId) {
      if (!confirm('¿Estás seguro de que querés eliminar este producto?')) return;

      let { error } = await _supabase.from('productos').delete().eq('id', prodId);
      if (error) {
        error = (await _supabase.from('productos_feriante').delete().eq('id', prodId)).error;
      }

      if (!error) {
        await cargarProductosPanel();
      } else {
        alert('Error al eliminar producto: ' + error.message);
      }
    }
  </script>
</body>
</html>
